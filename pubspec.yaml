name: food_app
description: "Food App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # state management + DI (providers double as the service locator)
  provider: ^6.1.2
  # networking
  dio: ^5.7.0
  dio_http_formatter: ^3.3.0
  connectivity_plus: ^6.1.3
  # routing with deep-link support
  go_router: ^15.1.2
  # local storage
  hive: ^2.2.3
  path_provider: ^2.1.5
  # forms
  flutter_form_builder: ^10.0.1
  form_builder_validators: ^11.0.0
  # value equality for entities
  equatable: ^2.0.7
  # environment config
  flutter_dotenv: ^5.2.1
  # media / assets
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  cached_network_svg_image: ^1.2.0
  image_picker: ^1.1.2
  google_maps_flutter: ^2.9.0
  intl: any
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/

